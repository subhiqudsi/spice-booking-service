<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 476" width="980" height="476" role="img" aria-label="Sequence for a booking: the Spice backend posts a reservation; guards validate the key and JWT; controllers fetch contact details from the Contact system with the JWT, queue a job with encrypted contact data and no token, and reply 202 pending. The worker fills the SevenRooms booking form, reads the confirmation screen, checks date, time and party size, saves the status, and the status webhook delivers reservation.confirmed with the code to the backend.">
  <title>Sequence for a booking: the Spice backend posts a reservation; guards validate the key and JWT; controllers fetch contact details from the Contact system with the JWT, queue a job with encrypted contact data and no token, and reply 202 pending. The worker fills the SevenRooms booking form, reads the confirmation screen, checks date, time and party size, saves the status, and the status webhook delivers reservation.confirmed with the code to the backend.</title>
  <style>
    svg { --surface:#ffffff; --surface-2:#eceef3; --fg:#1a2030; --muted:#5a6275; --line:#c6ccd8; --edge:#6b7386; --accent:#3546c8; --ok:#1d7f55; --bad:#b8353a; --warn:#9a6200; }
    @media (prefers-color-scheme: dark) {
      svg { --surface:#161b24; --surface-2:#1d2430; --fg:#e5e8ef; --muted:#9aa2b3; --line:#333b4a; --edge:#8b93a5; --accent:#93a1ff; --ok:#4fc38f; --bad:#f07a7e; --warn:#e3b04f; }
    }
    .bg { fill: var(--surface); }
    .n { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .n.hl { stroke: var(--accent); stroke-width: 1.6; }
    .n.ok { stroke: var(--ok); stroke-width: 1.6; }
    .n.bad { stroke: var(--bad); stroke-width: 1.6; }
    .n.warn { stroke: var(--warn); stroke-width: 1.6; }
    .grp { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
    .gt { fill: var(--muted); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .t { fill: var(--fg); font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: var(--muted); font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .e { stroke: var(--edge); stroke-width: 1.4; fill: none; }
    .e.d { stroke-dasharray: 5 4; }
    .e.a { stroke: var(--accent); stroke-width: 1.8; }
    .e.x { stroke: var(--bad); stroke-dasharray: 4 4; }
    .life { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
    .lb { fill: var(--muted); font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
    .lb.a { fill: var(--accent); }
    .lb.x { fill: var(--bad); }
    .mk { fill: var(--edge); }
    .mk.a { fill: var(--accent); }
    .dot { fill: var(--fg); }
    .cross { stroke: var(--bad); stroke-width: 2.2; }
    .boundary { fill: none; stroke: var(--bad); stroke-width: 1.2; stroke-dasharray: 6 5; }
    .tx { fill: var(--fg); font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ta { fill: var(--accent); font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect class="bg" x="0" y="0" width="980" height="476" rx="10"/>

        <defs>
          <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
          <marker id="f2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk a" d="M0 0L10 5L0 10z"/></marker>
        </defs>
        <!-- lanes -->
        <g>
          <rect class="n" x="8" y="12" width="124" height="40" rx="6"/><text class="t" x="70" y="37" text-anchor="middle">Spice backend</text>
          <rect class="n hl" x="148" y="12" width="124" height="40" rx="6"/><text class="t" x="210" y="37" text-anchor="middle">Guards</text>
          <rect class="n" x="288" y="12" width="124" height="40" rx="6"/><text class="t" x="350" y="37" text-anchor="middle">Controllers</text>
          <rect class="n" x="428" y="12" width="124" height="40" rx="6"/><text class="t" x="490" y="37" text-anchor="middle">Contact system</text>
          <rect class="n" x="568" y="12" width="124" height="40" rx="6"/><text class="t" x="630" y="37" text-anchor="middle">BullMQ</text>
          <rect class="n" x="708" y="12" width="124" height="40" rx="6"/><text class="t" x="770" y="37" text-anchor="middle">Worker + script</text>
          <rect class="n" x="848" y="12" width="124" height="40" rx="6"/><text class="t" x="910" y="37" text-anchor="middle">sevenrooms.com</text>
          <line class="life" x1="70" y1="52" x2="70" y2="470"/>
          <line class="life" x1="210" y1="52" x2="210" y2="470"/>
          <line class="life" x1="350" y1="52" x2="350" y2="470"/>
          <line class="life" x1="490" y1="52" x2="490" y2="470"/>
          <line class="life" x1="630" y1="52" x2="630" y2="470"/>
          <line class="life" x1="770" y1="52" x2="770" y2="470"/>
          <line class="life" x1="910" y1="52" x2="910" y2="470"/>
        </g>
        <!-- messages -->
        <line class="e" x1="70" y1="84" x2="208" y2="84" marker-end="url(#f2a)"/><text class="lb" x="140" y="77" text-anchor="middle">POST /v1/reservations</text>
        <line class="e" x1="210" y1="118" x2="348" y2="118" marker-end="url(#f2a)"/><text class="lb" x="280" y="111" text-anchor="middle">key + JWT valid</text>
        <line class="e a" x1="350" y1="152" x2="488" y2="152" marker-end="url(#f2b)"/><text class="lb a" x="420" y="145" text-anchor="middle">get contact (JWT)</text>
        <line class="e d" x1="490" y1="186" x2="352" y2="186" marker-end="url(#f2a)"/><text class="lb" x="420" y="179" text-anchor="middle">name · phone · email</text>
        <line class="e a" x1="350" y1="220" x2="628" y2="220" marker-end="url(#f2b)"/><text class="lb a" x="490" y="213" text-anchor="middle">job: encrypted contact, no token</text>
        <line class="e d" x1="350" y1="254" x2="72" y2="254" marker-end="url(#f2a)"/><text class="lb" x="210" y="247" text-anchor="middle">202 · pending</text>
        <line class="e" x1="630" y1="288" x2="768" y2="288" marker-end="url(#f2a)"/><text class="lb" x="700" y="281" text-anchor="middle">job</text>
        <line class="e" x1="770" y1="322" x2="908" y2="322" marker-end="url(#f2a)"/><text class="lb" x="840" y="315" text-anchor="middle">fill booking form</text>
        <line class="e d" x1="910" y1="356" x2="772" y2="356" marker-end="url(#f2a)"/><text class="lb" x="840" y="349" text-anchor="middle">confirmation screen</text>
        <rect class="n hl" x="700" y="374" width="140" height="44" rx="6"/><text class="s" x="770" y="392" text-anchor="middle" style="fill: var(--fg)">check date, time,</text><text class="s" x="770" y="407" text-anchor="middle" style="fill: var(--fg)">party size · save</text>
        <line class="e a" x1="770" y1="452" x2="72" y2="452" marker-end="url(#f2b)"/><text class="lb a" x="420" y="445" text-anchor="middle">status webhook: reservation.confirmed · code</text>
      </svg>
