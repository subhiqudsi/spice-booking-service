<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Repair loop: a script failure in a worker queues one repair per script, the orchestrator checks the budget, the script agent writes a candidate, validation gates test it, it is committed and tagged, sent to 10 percent of traffic, then made active. Failed validation retries up to three times and then alerts a person. A canary that does worse than the old version is rolled back.">
  <title>Repair loop: a script failure in a worker queues one repair per script, the orchestrator checks the budget, the script agent writes a candidate, validation gates test it, it is committed and tagged, sent to 10 percent of traffic, then made active. Failed validation retries up to three times and then alerts a person. A canary that does worse than the old version is rolled back.</title>
  <style>
    svg { --surface:#ffffff; --surface-2:#eceef3; --fg:#1a2030; --muted:#5a6275; --line:#c6ccd8; --edge:#6b7386; --accent:#3546c8; --ok:#1d7f55; --bad:#b8353a; --warn:#9a6200; }
    @media (prefers-color-scheme: dark) {
      svg { --surface:#161b24; --surface-2:#1d2430; --fg:#e5e8ef; --muted:#9aa2b3; --line:#333b4a; --edge:#8b93a5; --accent:#93a1ff; --ok:#4fc38f; --bad:#f07a7e; --warn:#e3b04f; }
    }
    .bg { fill: var(--surface); }
    .n { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .n.hl { stroke: var(--accent); stroke-width: 1.6; }
    .n.ok { stroke: var(--ok); stroke-width: 1.6; }
    .n.bad { stroke: var(--bad); stroke-width: 1.6; }
    .n.warn { stroke: var(--warn); stroke-width: 1.6; }
    .grp { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
    .gt { fill: var(--muted); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .t { fill: var(--fg); font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: var(--muted); font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .e { stroke: var(--edge); stroke-width: 1.4; fill: none; }
    .e.d { stroke-dasharray: 5 4; }
    .e.a { stroke: var(--accent); stroke-width: 1.8; }
    .e.x { stroke: var(--bad); stroke-dasharray: 4 4; }
    .life { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
    .lb { fill: var(--muted); font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
    .lb.a { fill: var(--accent); }
    .lb.x { fill: var(--bad); }
    .mk { fill: var(--edge); }
    .mk.a { fill: var(--accent); }
    .dot { fill: var(--fg); }
    .cross { stroke: var(--bad); stroke-width: 2.2; }
    .boundary { fill: none; stroke: var(--bad); stroke-width: 1.2; stroke-dasharray: 6 5; }
    .tx { fill: var(--fg); font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ta { fill: var(--accent); font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="280" rx="10"/>

        <defs>
          <marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
        </defs>
        <rect class="n bad" x="16" y="70" width="116" height="60" rx="6"/><text class="t" x="74" y="96" text-anchor="middle">Script failure</text><text class="s" x="74" y="113" text-anchor="middle">the first one counts</text>
        <rect class="n" x="158" y="70" width="116" height="60" rx="6"/><text class="t" x="216" y="96" text-anchor="middle">Repair queue</text><text class="s" x="216" y="113" text-anchor="middle">1 per script · budget</text>
        <rect class="n" x="300" y="70" width="116" height="60" rx="6"/><text class="t" x="358" y="96" text-anchor="middle">Script agent</text><text class="s" x="358" y="113" text-anchor="middle">Claude + Playwright</text>
        <rect class="n hl" x="442" y="70" width="116" height="60" rx="6"/><text class="t" x="500" y="96" text-anchor="middle">Validation</text><text class="s" x="500" y="113" text-anchor="middle">5 gates, dry run</text>
        <rect class="n" x="584" y="70" width="116" height="60" rx="6"/><text class="t" x="642" y="96" text-anchor="middle">Commit</text><text class="s" x="642" y="113" text-anchor="middle">scripts repo + tag</text>
        <rect class="n" x="726" y="70" width="116" height="60" rx="6"/><text class="t" x="784" y="96" text-anchor="middle">Canary</text><text class="s" x="784" y="113" text-anchor="middle">10% of traffic</text>
        <rect class="n ok" x="868" y="70" width="116" height="60" rx="6"/><text class="t" x="926" y="96" text-anchor="middle">Active</text><text class="s" x="926" y="113" text-anchor="middle">old one retired</text>
        <line class="e" x1="132" y1="100" x2="156" y2="100" marker-end="url(#f4a)"/>
        <line class="e" x1="274" y1="100" x2="298" y2="100" marker-end="url(#f4a)"/>
        <line class="e" x1="416" y1="100" x2="440" y2="100" marker-end="url(#f4a)"/>
        <line class="e" x1="558" y1="100" x2="582" y2="100" marker-end="url(#f4a)"/>
        <line class="e" x1="700" y1="100" x2="724" y2="100" marker-end="url(#f4a)"/>
        <line class="e" x1="842" y1="100" x2="866" y2="100" marker-end="url(#f4a)"/>
        <path class="e d" d="M500 70V40H358V68" marker-end="url(#f4a)"/><text class="lb" x="429" y="33" text-anchor="middle">failed → retry (max 3)</text>
        <line class="e x" x1="500" y1="130" x2="500" y2="200" marker-end="url(#f4a)"/><text class="lb x" x="508" y="170">3rd failure</text>
        <rect class="n bad" x="430" y="202" width="140" height="52" rx="6"/><text class="t" x="500" y="224" text-anchor="middle">Alert a person</text><text class="s" x="500" y="241" text-anchor="middle">keep last-known-good</text>
        <line class="e x" x1="784" y1="130" x2="784" y2="200" marker-end="url(#f4a)"/><text class="lb x" x="792" y="170">worse than old</text>
        <rect class="n bad" x="714" y="202" width="140" height="52" rx="6"/><text class="t" x="784" y="224" text-anchor="middle">Roll back</text><text class="s" x="784" y="241" text-anchor="middle">to last-known-good</text>
        <text class="ta" x="926" y="152" text-anchor="middle">submit script only:</text>
        <text class="ta" x="926" y="166" text-anchor="middle">N real bookings</text>
        <text class="ta" x="926" y="180" text-anchor="middle">or a person's OK</text>
      </svg>
